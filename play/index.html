const cx = cv.getContext("2d");
cx.imageSmoothingEnabled = false;

const W = 960, H = 540;
const TILE = 36, ROWS = 15;

/* ---------- resize to fit screen ---------- */
function fit(){
  const ww = window.innerWidth, wh = window.innerHeight;
  const s = Math.min(ww / W, wh / H);
  cv.style.width  = (W * s) + "px";
  cv.style.height = (H * s) + "px";
}
window.addEventListener("resize", fit); fit();

/* ---------- tiny sound engine ---------- */
let AC = null;
function ensureAudio(){
  if (!AC){ try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ AC = null; } }
  if (AC && AC.state === "suspended") AC.resume();
}
function sfx(f0, f1, dur, type, vol){
  if (!AC) return;
  try{
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f0, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), AC.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.08, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
const S = {
  jump:  () => sfx(320, 660, 0.18, "square", 0.06),
  djump: () => sfx(420, 880, 0.18, "square", 0.06),

  stomp: () => sfx(300, 90, 0.2, "square", 0.09),

  click: () => sfx(600, 500, 0.06, "square", 0.05),

/* ---------- chiptune music ---------- */
let musicOn = true, musicTimer = null, mStep = 0, mNext = 0;
const nf = m => 440 * Math.pow(2, (m - 69) / 12);
const MEL = [72,0,76,0,79,0,76,72, 74,0,77,0,81,79,76,0,
             72,0,76,0,79,0,83,81, 79,77,76,74,72,0,0,0];
const BASS = [48,55,45,52, 41,48,43,47];
function playNote(midi, t, dur, type, vol){
  if (!AC || !midi) return;
  try{
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(nf(midi), t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur);
  }catch(e){}
}
function schedMusic(){
  if (!AC || !musicOn) return;
  const spb = 60 / 132 / 2;   // eighth notes at 132 bpm
  while (mNext < AC.currentTime + 0.35){
    const s = mStep % 32;
    playNote(MEL[s], mNext, 0.14, "square", 0.028);
    if (s % 4 === 0) playNote(BASS[Math.floor(s / 4) % 8], mNext, 0.24, "triangle", 0.055);
    mStep++; mNext += spb;
  }
}
function startMusic(){
  if (!AC || musicTimer) return;
  mNext = AC.currentTime + 0.1;
  musicTimer = setInterval(schedMusic, 110);
}

/* ============================================================
   PIXEL-ART CHARACTER FACTORY
   ============================================================ */
function px(c, x, y, w, h, col){ c.fillStyle = col; c.fillRect(x, y, w||1, h||1); }

function buildChar(o){
  // 12 x 14 pixel sprite
  const c = document.createElement("canvas");
  c.width = 12; c.height = 14;
  const g = c.getContext("2d");
  const skin = o.skin, hair = o.hair, shirt = o.shirt, pants = o.pants, shoe = o.shoe || "#3a2417";
  // hair / cap
  px(g, 2, 0, 8, 1, hair);
  px(g, 1, 1, 10, 2, hair);
  if (o.cap){ px(g, 1, 2, 11, 1, hair); } // brim
  // face
  px(g, 2, 3, 8, 4, skin);
  if (!o.cap){ px(g, 1, 3, 1, 2, hair); px(g, 10, 3, 1, 2, hair); } // sideburns
  if (o.headband){ px(g, 2, 3, 8, 1, o.headband); }
  // eyes
  px(g, 4, 4, 1, 1, "#111"); px(g, 8, 4, 1, 1, "#111");
  if (o.glasses){
    px(g, 3, 4, 3, 1, "rgba(255,255,255,0.55)"); px(g, 7, 4, 3, 1, "rgba(255,255,255,0.55)");
    px(g, 3, 3, 3, 1, "#111"); px(g, 7, 3, 3, 1, "#111");
    px(g, 6, 4, 1, 1, "#111");
    px(g, 4, 4, 1, 1, "#111"); px(g, 8, 4, 1, 1, "#111");
  }
  if (o.moustache){ px(g, 3, 6, 6, 1, "#1c1210"); }
  // body
  px(g, 2, 7, 8, 4, shirt);
  if (o.bib){ px(g, 4, 7, 4, 3, "#fff"); px(g,5,8,2,1,"#e33"); }
  if (o.belly){ px(g, 4, 8, 4, 3, o.belly); }
  // arms
  px(g, 1, 7, 1, 3, o.sleeves || shirt); px(g, 10, 7, 1, 3, o.sleeves || shirt);
  px(g, 1, 10, 1, 1, skin); px(g, 10, 10, 1, 1, skin);
  // pants
  px(g, 2, 11, 8, 2, pants);
  px(g, 5, 11, 2, 2, pants);
  // legs gap
  px(g, 5, 12, 2, 1, "rgba(0,0,0,0.25)");
  // shoes
  px(g, 1, 13, 4, 1, shoe); px(g, 7, 13, 4, 1, shoe);
  if (o.bow){ px(g, 0, 0, 2, 2, o.bow); px(g, 2, 1, 1, 1, o.bow); }
  if (o.horns){ px(g, 1, 0, 1, 2, "#fff"); px(g, 10, 0, 1, 2, "#fff"); }
  if (o.shellSpikes){ px(g, 0, 7, 1, 1, "#fff"); px(g, 0, 9, 1, 1, "#fff"); px(g, 11, 7, 1, 1, "#fff"); px(g, 11, 9, 1, 1, "#fff"); }
  return c;
}

function buildBouncer(){
  // diagonal bouncer: spiky diamond that ricochets around
  const c = document.createElement("canvas"); c.width = 12; c.height = 12;
  const g = c.getContext("2d");
  for (let y = 0; y < 12; y++){
    const d = Math.abs(y - 5.5);
    const half = Math.max(1, Math.round(6 - d));
    px(g, 6 - half, y, half * 2, 1, "#d8303c");
  }
  for (let y = 3; y < 9; y++){
    const d = Math.abs(y - 5.5);
    const half = Math.max(1, Math.round(3.5 - d));
    px(g, 6 - half, y, half * 2, 1, "#ff8a3c");
  }
  px(g, 5, 0, 2, 1, "#fff"); px(g, 5, 11, 2, 1, "#fff");               // spike tips
  px(g, 0, 5, 1, 2, "#fff"); px(g, 11, 5, 1, 2, "#fff");
  px(g, 4, 5, 1, 1, "#111"); px(g, 7, 5, 1, 1, "#111");                // eyes
  px(g, 4, 7, 4, 1, "#7a1018");                                        // frown
  return c;
}
function buildTurret(){
  const c = document.createElement("canvas"); c.width = 12; c.height = 12;

  px(g, 4, 4, 4, 4, "#2c2c38");

}

/* ============================================================
   LEVELS
   grid chars: '.' air  G ground  B brick  C coin  S spike
               E chaser  D diagonal bouncer  L laser turret  F flag/goal
   ============================================================ */
function emptyGrid(w){
  const rows = [];
  for (let r = 0; r < ROWS; r++){
    const row = new Array(w).fill(".");
    rows.push(row);
  }
  for (let x = 0; x < w; x++){ rows[13][x] = "G"; rows[14][x] = "G"; }
  return rows;
}
function stamp(gr, x, y, ch){ if (y>=0 && y<ROWS && x>=0 && x<gr[0].length) gr[y][x] = ch; }
function gap(gr, x, w){ for (let i=0;i<w;i++){ gr[13][x+i]="."; gr[14][x+i]="."; } }
function plat(gr, x, y, w, ch){ for (let i=0;i<w;i++) stamp(gr, x+i, y, ch||"B"); }
function coins(gr, x, y, n){ for (let i=0;i<n;i++) stamp(gr, x+i, y, "C"); }

/* ============================================================
   SAVING (localStorage) + SHARE CODES
   ============================================================ */
const VALID_CHARS = ".GBCSEDLFKA";
function saveData(){
  if (window.__previewMode) return;   // website embeds must never touch real saves
  try{
    const data = {
      sel: selChar,
      wpn: selWeapon,
      count: customCount,
      music: musicOn,
      demoStars: courses.filter(c => !c.custom).map(c => c.stars || 0),
      courses: courses.filter(c => c.custom).map(c => ({
        name: c.name, theme: c.theme, stars: c.stars || 0, grid: c.grid.map(r => r.join(""))
      }))
    };
    localStorage.setItem("nrun-save", JSON.stringify(data));
  }catch(e){}
}
function loadData(){
  try{
    const d = JSON.parse(localStorage.getItem("nrun-save"));
    if (!d) return;
    selChar = (d.sel >= 0 && d.sel < CHARACTERS.length) ? d.sel : 0;
    selWeapon = (d.wpn >= 0 && d.wpn < WEAPONS.length) ? d.wpn : 0;
    customCount = d.count || 0;
    if (d.music === false) musicOn = false;
    (d.demoStars || []).forEach((s, i) => { if (courses[i] && !courses[i].custom) courses[i].stars = s; });
    for (const c of (d.courses || [])){
      if (!c.grid || c.grid.length !== ROWS) continue;
      courses.push({ name: c.name, theme: c.theme || "day", custom: true, stars: c.stars || 0,
                     grid: c.grid.map(r => r.split("")) });
    }
  }catch(e){}
}
function rleRow(s){
  let out = "", i = 0;
  while (i < s.length){
    let j = i;
    while (j < s.length && s[j] === s[i]) j++;
    const n = j - i;
    out += s[i] + (n > 1 ? n : "");
    i = j;
  }
  return out;
}
function unrleRow(s){
  let out = "", i = 0;
  while (i < s.length){
    const ch = s[i++];
    let num = "";
    while (i < s.length && s[i] >= "0" && s[i] <= "9") num += s[i++];
    out += ch.repeat(num ? parseInt(num) : 1);
  }
  return out;
}
function courseCode(c){
  const name = c.name.replace(/\|/g, " ");
  const raw = [name, c.theme || "day"].concat(c.grid.map(r => rleRow(r.join("")))).join("|");
  return "NRUN1." + btoa(raw);
}
function importCode(str){
  try{
    str = (str || "").trim();
    if (!str.startsWith("NRUN1.")) return null;
    const parts = atob(str.slice(6)).split("|");
    if (parts.length !== 2 + ROWS) return null;
    const name = (parts[0] || "SHARED COURSE").slice(0, 18).toUpperCase();
    const theme = THEMES.includes(parts[1]) ? parts[1] : "day";
    let rows = parts.slice(2).map(unrleRow);
    const w = Math.max.apply(null, rows.map(r => r.length));
    if (w < 20 || w > 400) return null;
    rows = rows.map(r => (r + ".".repeat(w - r.length)).slice(0, w));
    for (const r of rows) for (const ch of r) if (VALID_CHARS.indexOf(ch) < 0) return null;
    customCount++;
    const c = { name, theme, custom: true, grid: rows.map(r => r.split("")) };
    courses.push(c);
    saveData();
    return c;
  }catch(e){ return null; }
}

function shareURL(code){
  return location.origin + location.pathname + "#c=" + encodeURIComponent(code);
}
let qrLibState = 0; // 0 not loaded, 1 loading, 2 ready, -1 failed
function withQRLib(cb){
  if (window.QRCode){ qrLibState = 2; cb(true); return; }
  if (qrLibState === -1){ cb(false); return; }
  const done = ok => { qrLibState = ok ? 2 : -1; cb(ok); };
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
  s.onload = () => done(!!window.QRCode);
  s.onerror = () => done(false);
  document.head.appendChild(s);
}

/* ============================================================
   GAME STATE
   ============================================================ */
let state = "TITLE";   // TITLE, SELECT, COURSES, PLAY, WIN, GAMEOVER, EDIT, PAUSE
let course = null;     // current course object
let editorReturn = false;
let toast = null, toastT = 0;
let lastStars = 0, lastStarFlags = [false, false, false];

const P = {  // player
  x:0, y:0, vx:0, vy:0, w:26, h:32,
  grounded:false, airLeft:1, hearts:3, maxHearts:3, coins:0,
  inv:0, anim:0, alive:true, coyote:0, jumpBuf:0, dying:0,
  ammo:0, shieldT:0
};
let shots = [], playGrid = null;
let cam = 0;
let chasers = [], bouncers = [], turrets = [], collected = null, flagPos = null;
let time = 0;
let checkpoint = null, totalCoins = 0, damaged = false;
let parts = [], shake = 0;
const THEMES = ["day", "sunset", "night", "space"];
function burst(x, y, cols, n, spd){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = (0.5 + Math.random()) * spd;
    parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1.5,
                 life: 22 + Math.random()*18, col: cols[i % cols.length], sz: 3 + Math.random()*3 });
  }
}
function updateParts(){
  for (const p of parts){ p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life--; }
  parts = parts.filter(p => p.life > 0);
}

const RUN = 3.5, GRAV = 0.55, JUMP = -11.4, MAXFALL = 13;

function isSolid(ch){ return ch === "G" || ch === "B" || ch === "L"; }
function tileAt(g, tx, ty){
  if (tx < 0 || tx >= g[0].length) return "B"; // side walls
  if (ty < 0) return ".";
  if (ty >= ROWS) return ".";
  return g[ty][tx];
}

function startCourse(c, fromEditor){
  if (course !== c || fromEditor) checkpoint = null;   // checkpoint survives retries of the same course
  course = c;
  editorReturn = !!fromEditor;
  const A = abil();
  P.maxHearts = A.hearts;
  P.hearts = A.hearts;
  damaged = false;
  beginAttempt();
  state = "PLAY";
}
function beginAttempt(){
  playGrid = cloneGrid(course.grid);   // runtime copy — smashed bricks never touch the real course
  const g = playGrid;
  P.vx = RUN; P.vy = 0;
  P.grounded = false; P.airLeft = abil().jumps - 1;
  P.coins = 0; P.inv = 0; P.alive = true; P.coyote = 0; P.jumpBuf = 0; P.dying = 0;
  P.ammo = 0; P.shieldT = 0;
  parts = []; shake = 0; shots = [];
  if (checkpoint){
    P.x = checkpoint.tx * TILE + 4;
    P.y = checkpoint.ty * TILE - P.h - 2;
  } else {
    P.x = TILE * 1.2;
    let sy = 12;
    for (let r = 0; r < ROWS; r++){ if (isSolid(g[r][1])){ sy = r; break; } }
    P.y = sy * TILE - P.h - 2;
  }
  cam = Math.max(0, Math.min(g[0].length*TILE - W, P.x - W*0.3)); time = 0;
  totalCoins = 0;
  for (let r = 0; r < ROWS; r++) for (let x = 0; x < g[0].length; x++) if (g[r][x] === "C") totalCoins++;
  chasers = []; bouncers = []; turrets = []; collected = new Set(); flagPos = null;
  for (let r = 0; r < ROWS; r++){
    for (let x = 0; x < g[0].length; x++){
      const ch = g[r][x];
      if (ch === "E") chasers.push({ x:x*TILE+5, y:r*TILE+8, vx:0, vy:0, ox:x*TILE+5, oy:r*TILE+8, alive:true, t:Math.random()*6 });
      if (ch === "D") bouncers.push({ x:x*TILE+6, y:r*TILE+6, vx:((x+r)%2 ? 1.8 : -1.8), vy:1.8, alive:true });
      if (ch === "L") turrets.push({ tx:x, ty:r, phase:Math.random()*2 });
      if (ch === "F") flagPos = { x, y:r };
    }
  }
}

/* ============================================================
   PHYSICS + UPDATE
   ============================================================ */
function rectVsGrid(g, x, y, w, h, fn){
  const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.0001) / TILE);
  const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.0001) / TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      fn(tx, ty, tileAt(g, tx, ty));
}

function overlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

function startDeath(short){
  P.alive = false;
  P.dying = short ? 40 : 80;
  P.vy = short ? 2 : -9.5;
  shake = 10;
  burst(P.x + P.w/2, P.y + P.h/2, ["#ff3b58","#ffd428","#fff"], 18, 3);
}
function damagePlayer(){
  if (P.inv > 0 || !P.alive) return;
  P.hearts--;
  damaged = true;
  S.hurt();
  shake = 8;
  burst(P.x + P.w/2, P.y + P.h/2, ["#ff3b58","#ff8a9c"], 10, 2.5);
  if (P.hearts <= 0){ startDeath(false); return; }
  P.inv = 90; P.vy = -7;
}
function fallDeath(){
  if (!P.alive) return;
  P.hearts--;
  damaged = true;
  S.hurt();
  if (P.hearts <= 0){ startDeath(true); return; }
  const hearts = P.hearts;
  beginAttempt();          // respawns at checkpoint if one was reached
  P.hearts = hearts;
}

function jump(){
  if (!P.alive) return;
  const A = abil();
  if (P.grounded || P.coyote > 0){
    P.vy = JUMP * A.jumpMul; P.grounded = false; P.coyote = 0; S.jump();
  } else if (P.airLeft > 0){
    P.vy = JUMP * 0.92 * A.airMul; P.airLeft--; S.djump();
    burst(P.x + P.w/2, P.y + P.h, ["#fff","#8ad4ff"], 6, 1.5);
  } else {
    P.jumpBuf = 8;          // buffered — fires the instant we land
  }
}
function jumpCut(){
  if (state === "PLAY" && P.alive && P.vy < -4.5) P.vy = -4.5;  // release early = smaller hop
}

/* ============================================================
   WEAPONS — pick any weapon, any hero
   ============================================================ */
function shoot(){
  if (state !== "PLAY" || !P.alive) return;
  const wid = WEAPONS[selWeapon].id;
  if (wid === "sword"){                     // sword is free — but has a cooldown
    if (swordCd > 0) return;
    swordCd = 30;
    shots.push({ t:"sword", x:P.x + P.w, y:P.y + P.h/2, vx:0, vy:0, life:14 });
    S.shoot();
    return;
  }
  if (P.ammo <= 0){ S.empty(); return; }
  if (wid === "shield"){
    P.ammo--; P.shieldT = 110; S.shoot();
    burst(P.x + P.w + 8, P.y + P.h/2, ["#8ad4ff","#fff"], 8, 2);
    return;
  }
  if (shots.length > 5) return;
  P.ammo--;
  const x = P.x + P.w, y = P.y + P.h/2;
  const sd = Math.random() * 6;
  if (wid === "cart")    shots.push({ t:"cart",   x, y, vx:7.5, vy:0, life:80 });
  if (wid === "star")    shots.push({ t:"star",   x, y, vx:7.5, vy:0, life:280, phase:0 });
  if (wid === "fire")    shots.push({ t:"fire",   x, y, vx:5, vy:-3, life:150 });
  if (wid === "bub")     shots.push({ t:"bub",    x, y, vx:3, vy:0, life:120, sd });
  if (wid === "heart")   shots.push({ t:"heart",  x, y, vx:5.5, vy:0, life:95, sd });
  if (wid === "wave")    shots.push({ t:"wave",   x, y, vx:9.5, vy:0, life:26 });
  if (wid === "trident") shots.push({ t:"trident",x, y, vx:8.5, vy:-1.4, life:110 });
  if (wid === "gun")     shots.push({ t:"pellet", x, y, vx:13, vy:0, life:60 });
  S.shoot();
}
function solidAtPx(x, y){
  return isSolid(tileAt(playGrid, Math.floor(x / TILE), Math.floor(y / TILE)));
}
function smashBrickAt(pxX, pxY){
  // EVERY weapon can break bricks!
  const tx = Math.floor(pxX / TILE), ty = Math.floor(pxY / TILE);
  if (tileAt(playGrid, tx, ty) === "B"){
    playGrid[ty][tx] = ".";
    burst(tx*TILE+TILE/2, ty*TILE+TILE/2, ["#b8484a","#8f3436","#fff"], 10, 2.8);
    S.smash(); shake = 4;
    return true;
  }
  return false;
}
function shotHitEnemy(s){
  // returns list of enemies (chasers+bouncers) overlapping shot point
  const hits = [];
  for (const e of chasers) if (e.alive && !e.bubbled && overlap(s.x-10, s.y-10, 20, 20, e.x+2, e.y+2, 24, 20)) hits.push(e);
  for (const b of bouncers) if (b.alive && !b.bubbled && overlap(s.x-10, s.y-10, 20, 20, b.x, b.y, 24, 24)) hits.push(b);
  return hits;
}
function updateShots(){
  for (const s of shots){
    if (s.t === "cart"){
      s.x += s.vx;
      if (solidAtPx(s.x + 8, s.y)){ smashBrickAt(s.x + 8, s.y); s.life = 0; burst(s.x, s.y, ["#4a4a58","#e07b28"], 6, 2); }
    } else if (s.t === "fire"){
      s.vy += 0.3; s.x += s.vx; s.y += s.vy;
      if (s.vy > 0 && solidAtPx(s.x, s.y + 7)){ s.vy = -5.4; s.y -= 3; }
      if (solidAtPx(s.x + 8, s.y - 4)){ smashBrickAt(s.x + 8, s.y - 4); s.life = 0; burst(s.x, s.y, ["#ff8a3c","#ffd428"], 6, 2); }
    } else if (s.t === "star"){
      if (s.phase === 0){ s.x += s.vx; s.vx -= 0.26; if (s.vx <= 0) s.phase = 1; }
      else {
        const dx = (P.x + P.w/2) - s.x, dy = (P.y + P.h/2) - s.y;
        const d = Math.hypot(dx, dy) || 1;
        s.x += dx/d * 8.5; s.y += dy/d * 8.5;
        if (d < 22) s.life = 0;
      }
      // the boomerang grabs coins — and smashes bricks — on its way
      const tx0 = Math.floor((s.x-22)/TILE), tx1 = Math.floor((s.x+22)/TILE);
      const ty0 = Math.floor((s.y-22)/TILE), ty1 = Math.floor((s.y+22)/TILE);
      for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++){
        const tch = tileAt(playGrid, tx, ty);
        if (tch === "C"){
          const k = tx+","+ty;
          if (!collected.has(k)){
            collected.add(k); P.coins += abil().coinMul; S.coin();
            burst(tx*TILE+TILE/2, ty*TILE+TILE/2, ["#f7c800","#ffe670"], 6, 2);
          }
        } else if (tch === "B"){
          smashBrickAt(tx*TILE+1, ty*TILE+1);
        }
      }
    } else if (s.t === "bub"){
      s.x += s.vx; s.y += -0.35 + Math.sin(time/8 + s.sd) * 0.5;
      if (solidAtPx(s.x + 8, s.y)){ smashBrickAt(s.x + 8, s.y); s.life = 0; burst(s.x, s.y, ["#8ad4ff","#fff"], 5, 1.5); }
    } else if (s.t === "heart"){
      s.x += s.vx; s.y += Math.sin(time/6 + s.sd) * 1.3;
      if (solidAtPx(s.x + 7, s.y)){ smashBrickAt(s.x + 7, s.y); s.life = 0; burst(s.x, s.y, ["#ff8ac2","#fff"], 5, 1.5); }
    } else if (s.t === "sword"){
      // slash arc rides along with the player — and chops through bricks
      s.x = P.x + P.w + 6; s.y = P.y + P.h/2;
      for (let ty = Math.floor((s.y-30)/TILE); ty <= Math.floor((s.y+30)/TILE); ty++)
        for (let tx = Math.floor((s.x-8)/TILE); tx <= Math.floor((s.x+30)/TILE); tx++)
          if (tileAt(playGrid, tx, ty) === "B") smashBrickAt(tx*TILE+1, ty*TILE+1);
    } else if (s.t === "trident"){
      s.vy += 0.12; s.x += s.vx; s.y += s.vy;
      if (solidAtPx(s.x + 14, s.y)){
        if (!smashBrickAt(s.x + 14, s.y)){ s.life = 0; burst(s.x + 10, s.y, ["#e0c45c","#fff"], 6, 2); }
      }
    } else if (s.t === "pellet"){
      s.x += s.vx;
      if (solidAtPx(s.x + 8, s.y)){ smashBrickAt(s.x + 8, s.y); s.life = 0; burst(s.x, s.y, ["#ffd428","#fff"], 4, 1.5); }
    } else if (s.t === "wave"){
      s.x += s.vx;
      // the karate wave SMASHES BRICKS
      const tx0 = Math.floor(s.x/TILE), tx1 = Math.floor((s.x+20)/TILE);
      const ty0 = Math.floor((s.y-16)/TILE), ty1 = Math.floor((s.y+16)/TILE);
      for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++){
        const ch = tileAt(playGrid, tx, ty);
        if (ch === "B"){
          playGrid[ty][tx] = ".";
          burst(tx*TILE+TILE/2, ty*TILE+TILE/2, ["#b8484a","#8f3436","#fff"], 10, 2.8);
          S.smash(); shake = 4;
        } else if (ch === "G" || ch === "L"){ s.life = 0; }
      }
    }
    s.life--;
    if (s.life <= 0) continue;
    /* enemy hits */
    const hits = shotHitEnemy(s);
    for (const e of hits){
      if (s.t === "bub"){
        e.bubbled = 210; s.life = 0; S.pop();
        burst(e.x + 12, e.y + 10, ["#8ad4ff","#fff"], 8, 2);
      } else if (s.t === "heart"){
        e.alive = false; P.coins += 2; s.life = 0; S.coin();
        burst(e.x + 12, e.y + 10, ["#ff8ac2","#f7c800","#fff"], 14, 2.8);
      } else {
        e.alive = false; S.stomp(); shake = 4;
        burst(e.x + 12, e.y + 10, ["#d8303c","#e07b28","#fff"], 12, 2.6);
        if (s.t === "cart" || s.t === "fire" || s.t === "pellet") s.life = 0;
        // star, wave, sword and trident punch straight through
      }
    }
  }
  shots = shots.filter(s => s.life > 0);
}

function laserBeams(){
  // returns array of beam rects for turrets in fire phase
  const beams = [];
  const g = playGrid || course.grid;
  for (const t of turrets){
    const cyc = (time / 60 + t.phase) % 2.6;      // 2.6s cycle
    t.state = cyc < 1.2 ? "idle" : (cyc < 1.7 ? "warn" : "fire");
    if (t.state !== "fire") continue;
    const cxp = t.tx * TILE + TILE/2, cyp = t.ty * TILE + TILE/2;
    const bw = 8;
    // four directions
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const [dx,dy] of dirs){
      let tx = t.tx + dx, ty = t.ty + dy, len = 0;
      while (len < 8 && !isSolid(tileAt(g, tx, ty)) && tx>=0 && tx<g[0].length && ty>=-2 && ty<ROWS+2){
        tx += dx; ty += dy; len++;
      }
      if (dx !== 0){
        const x0 = dx>0 ? t.tx*TILE+TILE : (tx+1)*TILE;
        const x1 = dx>0 ? tx*TILE : t.tx*TILE;
        beams.push({ x:Math.min(x0,x1), y:cyp-bw/2, w:Math.abs(x1-x0), h:bw, tur:t });
      } else {
        const y0 = dy>0 ? t.ty*TILE+TILE : (ty+1)*TILE;
        const y1 = dy>0 ? ty*TILE : t.ty*TILE;
        beams.push({ x:cxp-bw/2, y:Math.min(y0,y1), w:bw, h:Math.abs(y1-y0), tur:t });
      }
    }
  }
  return beams;
}

function updatePlay(){
  const g = playGrid;
  time++;
  P.anim++;
  updateParts();
  if (shake > 0) shake--;

  /* --- death animation --- */
  if (P.dying > 0){
    P.vy = Math.min(P.vy + GRAV, MAXFALL);
    P.y += P.vy;
    P.dying--;
    if (P.dying === 0) state = "GAMEOVER";
    return;
  }
  if (P.inv > 0) P.inv--;
  if (P.shieldT > 0) P.shieldT--;
  if (swordCd > 0) swordCd--;
  updateShots();

  /* --- player horizontal --- */
  P.vx = RUN;
  let nx = P.x + P.vx;
  rectVsGrid(g, nx, P.y, P.w, P.h, (tx,ty,ch)=>{
    if (isSolid(ch)){
      const bx = tx*TILE;
      const pen = nx + P.w - bx;              // depth into tile from the left
      if (pen > 0 && pen <= TILE/2){ nx = bx - P.w; }
    }
  });
  P.x = nx;

  /* --- player vertical --- */
  P.vy = Math.min(P.vy + GRAV, MAXFALL * abil().fallMul);
  let ny = P.y + P.vy;
  let landed = false;
  rectVsGrid(g, P.x, ny, P.w, P.h, (tx,ty,ch)=>{
    if (isSolid(ch)){
      const by = ty*TILE;
      if (P.vy >= 0){
        const pen = ny + P.h - by;            // depth into tile from above
        if (pen > 0 && pen <= P.vy + 2){ ny = by - P.h; P.vy = 0; landed = true; }
      } else {
        const pen = (by + TILE) - ny;         // depth into tile from below
        if (pen > 0 && pen <= -P.vy + 2){ ny = by + TILE; P.vy = 0; }
      }
    }
  });
  P.y = ny;
  P.grounded = landed;
  if (landed){
    P.airLeft = abil().jumps - 1;
    P.coyote = 8;
    if (P.jumpBuf > 0){ P.jumpBuf = 0; jump(); }   // buffered jump fires on landing
  } else {
    if (P.coyote > 0) P.coyote--;
    if (P.jumpBuf > 0) P.jumpBuf--;
  }

  /* fell off the world */
  if (P.y > ROWS * TILE + 60){ fallDeath(); return; }

  /* --- tiles: coins, spikes, flag --- */
  rectVsGrid(g, P.x+4, P.y+4, P.w-8, P.h-8, (tx,ty,ch)=>{
    if (ch === "C"){
      const key = tx+","+ty;
      if (!collected.has(key)){
        collected.add(key);
        P.coins += abil().coinMul;
        S.coin();
        burst(tx*TILE+TILE/2, ty*TILE+TILE/2, ["#f7c800","#ffe670","#fff"], 8, 2);
      }
    }
    if (ch === "A"){
      const key = tx+","+ty;
      if (!collected.has(key)){
        collected.add(key);
        P.ammo += 5;
        S.reload();
        burst(tx*TILE+TILE/2, ty*TILE+TILE/2, ["#e0b45c","#8a6d2e","#fff"], 10, 2.2);
      }
    }
    if (ch === "K"){
      if (!checkpoint || checkpoint.tx !== tx || checkpoint.ty !== ty){
        checkpoint = { tx, ty };
        S.check();
        burst(tx*TILE+TILE/2, ty*TILE, ["#4fbc3c","#8aff5c","#fff"], 14, 2.5);
      }
    }
    if (ch === "S"){
      // spikes occupy lower 60% of tile
      if (overlap(P.x+4,P.y+4,P.w-8,P.h-8, tx*TILE+4, ty*TILE+TILE*0.4, TILE-8, TILE*0.6)) damagePlayer();
    }
    if (ch === "F"){
      // stars: 1 finish · 2 all coins · 3 no damage
      lastStarFlags = [true, collected.size === totalCoins, !damaged];
      const earned = lastStarFlags.filter(Boolean).length;
      lastStars = earned;
      if ((course.stars || 0) < earned) course.stars = earned;
      checkpoint = null;
      saveData();
      state = "WIN"; S.clear();
      burst(tx*TILE+TILE/2, ty*TILE - TILE, ["#ffd428","#ff5c8a","#8ad4ff","#8aff5c"], 30, 3.5);
    }
  });
  if (state !== "PLAY") return;

  /* --- chasers: diagonal chasing enemies --- */
  for (const e of chasers){
    if (!e.alive) continue;
    if (e.bubbled > 0){
      e.bubbled--; e.y -= 0.35; e.x += Math.sin(time/9) * 0.3;
      if (overlap(P.x, P.y, P.w, P.h, e.x-4, e.y-6, 34, 32)){
        e.alive = false; S.pop();
        burst(e.x + 12, e.y + 10, ["#8ad4ff","#fff","#6a2a9e"], 12, 2.5);
      }
      continue;
    }
    e.t += 1/60;
    const pcx = P.x + P.w/2, pcy = P.y + P.h/2;
    const ecx = e.x + 12, ecy = e.y + 10;
    const dx = pcx - ecx, dy = pcy - ecy;
    const dist = Math.hypot(dx, dy);
    if (dist < 300 && P.alive){
      // chase diagonally!
      e.vx += Math.sign(dx) * 0.14;
      e.vy += Math.sign(dy) * 0.14;
      e.vx = Math.max(-2.6, Math.min(2.6, e.vx));
      e.vy = Math.max(-2.6, Math.min(2.6, e.vy));
    } else {
      e.vx *= 0.95; e.vy *= 0.95;
      e.y = e.oy + Math.sin(e.t * 2.2) * 8; // hover
    }
    e.x += e.vx; e.y += e.vy;
    // collide with player
    if (P.inv <= 0 && overlap(P.x+3, P.y+3, P.w-6, P.h-6, e.x+2, e.y+2, 20, 16)){
      if (P.shieldT > 0){
        e.vx = 5 * Math.sign(e.x - P.x || 1); e.vy = -3.5;   // shield knocks it flying
        S.pop();
      } else if ((P.y + P.h) < (e.y + 15)){   // feet on its head = it dies, not you
        e.alive = false; P.vy = -8.5 * abil().stompMul; P.airLeft = abil().jumps - 1; S.stomp();
        shake = 5;
        burst(e.x + 12, e.y + 10, ["#4a4a58","#e07b28","#fff"], 12, 2.5);
      } else {
        damagePlayer();
      }
    }
  }

  /* --- diagonal bouncers --- */
  const BSZ = 24;
  const levelW = g[0].length * TILE;
  for (const b of bouncers){
    if (!b.alive) continue;
    if (b.bubbled > 0){
      b.bubbled--; b.y -= 0.35; b.x += Math.sin(time/9) * 0.3;
      if (overlap(P.x, P.y, P.w, P.h, b.x-4, b.y-4, 32, 32)){
        b.alive = false; S.pop();
        burst(b.x + 12, b.y + 12, ["#8ad4ff","#fff","#d8303c"], 12, 2.5);
      }
      continue;
    }
    // horizontal bounce
    let bnx = b.x + b.vx;
    let hitX = bnx < 0 || bnx + BSZ > levelW;
    if (!hitX) rectVsGrid(g, bnx, b.y, BSZ, BSZ, (tx,ty,ch)=>{ if (isSolid(ch)) hitX = true; });
    if (hitX) b.vx = -b.vx; else b.x = bnx;
    // vertical bounce
    let bny = b.y + b.vy;
    let hitY = bny < 0 || bny + BSZ > ROWS * TILE;
    if (!hitY) rectVsGrid(g, b.x, bny, BSZ, BSZ, (tx,ty,ch)=>{ if (isSolid(ch)) hitY = true; });
    if (hitY) b.vy = -b.vy; else b.y = bny;
    // player collision (stompable, like his notes: monsters to defeat!)
    if (P.inv <= 0 && overlap(P.x+3, P.y+3, P.w-6, P.h-6, b.x+3, b.y+3, BSZ-6, BSZ-6)){
      if (P.shieldT > 0){
        b.vx = Math.abs(b.vx) * Math.sign(b.x - P.x || 1); b.vy = -Math.abs(b.vy);
        S.pop();
      } else if ((P.y + P.h) < (b.y + BSZ*0.62)){   // feet on its head = it dies, not you
        b.alive = false; P.vy = -8.5 * abil().stompMul; P.airLeft = abil().jumps - 1; S.stomp();
        shake = 5;
        burst(b.x + 12, b.y + 12, ["#d8303c","#ff8a3c","#fff"], 12, 2.5);
      } else {
        damagePlayer();
      }
    }
  }

  /* --- lasers --- */
  const beams = laserBeams();
  if (P.shieldT > 0){
    // MIRROR SHIELD: any turret whose beam touches the shield gets its laser
    // bounced straight back — BOOM.
    for (let i = turrets.length - 1; i >= 0; i--){
      const t = turrets[i];
      if (t.state !== "fire") continue;
      const tb = beams.filter(b2 => b2.tur === t);
      for (const b2 of tb){
        if (overlap(P.x-4, P.y-4, P.w+8, P.h+8, b2.x, b2.y, b2.w, b2.h)){
          playGrid[t.ty][t.tx] = ".";
          burst(t.tx*TILE+TILE/2, t.ty*TILE+TILE/2, ["#ff2244","#6b6b80","#fff","#ffd428"], 20, 3.2);
          S.smash(); shake = 8;
          turrets.splice(i, 1);
          break;
        }
      }
    }
  } else if (P.inv <= 0){
    for (const b of beams){
      if (overlap(P.x+6, P.y+6, P.w-12, P.h-12, b.x, b.y, b.w, b.h)){ damagePlayer(); break; }
    }
  }
  for (const t of turrets){ if (t.state === "fire" && time % 20 === 0) S.laser(); }

  /* --- camera --- */
  const maxCam = g[0].length * TILE - W;
  cam = Math.max(0, Math.min(maxCam, P.x - W * 0.3));
}

let uiButtons = [];
function addBtn(id, x, y, w, h, label, opts){
  uiButtons.push({ id, x, y, w, h });
  const o = opts || {};
  cx.fillStyle = o.bg || "#2b2b46";
  roundRect(x, y, w, h, 10); cx.fill();
  cx.strokeStyle = o.border || "#565688"; cx.lineWidth = 3;
  roundRect(x, y, w, h, 10); cx.stroke();
  if (label){
    cx.fillStyle = o.color || "#fff";
    cx.font = (o.font || "bold 22px") + " monospace";
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText(label, x + w/2, y + h/2 + 1);
  }
}
function roundRect(x, y, w, h, r){
  cx.beginPath();
  cx.moveTo(x+r, y);
  cx.arcTo(x+w, y, x+w, y+h, r);
  cx.arcTo(x+w, y+h, x, y+h, r);
  cx.arcTo(x, y+h, x, y, r);
  cx.arcTo(x, y, x+w, y, r);
  cx.closePath();
}
function text(t, x, y, size, col, align){
  cx.fillStyle = col || "#fff";
  cx.font = "bold " + size + "px monospace";
  cx.textAlign = align || "center"; cx.textBaseline = "middle";
  cx.fillText(t, x, y);
}

const THEME_STYLE = {
  day:    { top:"#5aa6e8", bot:"#a8dcf0", cloud:"rgba(255,255,255,0.85)", hill:"#79c95e", stars:false },
  sunset: { top:"#ff7a3c", bot:"#ffd9a0", cloud:"rgba(255,220,235,0.85)", hill:"#4e8b3a", stars:false, sun:true },
  night:  { top:"#0b1030", bot:"#28336e", cloud:"rgba(200,210,255,0.18)", hill:"#1d4d2e", stars:true, moon:true },
  space:  { top:"#07021a", bot:"#341a58", cloud:null, hill:null, stars:true, planet:true },
};
function drawSky(camX, theme){
  const T2 = THEME_STYLE[theme] || THEME_STYLE.day;
  const grd = cx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, T2.top); grd.addColorStop(1, T2.bot);
  cx.fillStyle = grd; cx.fillRect(0, 0, W, H);
  // stars
  if (T2.stars){
    cx.fillStyle = "#fff";
    for (let i = 0; i < 60; i++){
      const sxp = ((i * 173 + 40 - camX * 0.15) % (W + 40) + W + 40) % (W + 40) - 20;
      const syp = (i * 97) % (H - 120);
      const tw = (Math.floor(time / 20) + i) % 7 === 0 ? 3 : 2;
      cx.fillRect(sxp, syp, tw, tw);
    }
  }
  // sun / moon / planet
  if (T2.sun){
    cx.fillStyle = "#ffe95c";
    cx.beginPath(); cx.arc(W - 180 , 120, 46, 0, Math.PI*2); cx.fill();
    cx.fillStyle = "rgba(255,233,92,0.35)";
    cx.beginPath(); cx.arc(W - 180, 120, 64, 0, Math.PI*2); cx.fill();
  }
  if (T2.moon){
    cx.fillStyle = "#f0f0da";
    cx.beginPath(); cx.arc(W - 160, 100, 38, 0, Math.PI*2); cx.fill();
    cx.fillStyle = T2.top;
    cx.beginPath(); cx.arc(W - 175, 92, 32, 0, Math.PI*2); cx.fill();
  }
  if (T2.planet){
    const pxp = ((700 - camX * 0.1) % (W + 400) + W + 400) % (W + 400) - 200;
    cx.fillStyle = "#c86a3c";
    cx.beginPath(); cx.arc(pxp, 130, 44, 0, Math.PI*2); cx.fill();
    cx.fillStyle = "#e8925c";
    cx.beginPath(); cx.arc(pxp - 12, 118, 12, 0, Math.PI*2); cx.fill();
    cx.strokeStyle = "#e8c89c"; cx.lineWidth = 6;
    cx.beginPath(); cx.ellipse(pxp, 132, 70, 16, -0.3, 0, Math.PI*2); cx.stroke();
    // little rocket
    const rx = ((camX * 0.25 + time * 0.5) % (W + 200)) - 100;
    cx.fillStyle = "#d8d8e0"; cx.fillRect(W - rx, 220, 26, 10);
    cx.fillStyle = "#ff5c3c"; cx.fillRect(W - rx + 26, 222, 8, 6);
  }
  // clouds
  if (T2.cloud){
    cx.fillStyle = T2.cloud;
    for (let i = 0; i < 6; i++){
      const cxp = ((i * 260 - camX * 0.3) % (W + 300) + W + 300) % (W + 300) - 150;
      const cyp = 50 + (i % 3) * 60;
      roundRect(cxp, cyp, 120, 30, 15); cx.fill();
      roundRect(cxp + 25, cyp - 16, 60, 26, 13); cx.fill();
    }
  }
  // hills
  if (T2.hill){
    cx.fillStyle = T2.hill;
    for (let i = 0; i < 5; i++){
      const hx = ((i * 420 - camX * 0.55) % (W + 500) + W + 500) % (W + 500) - 250;
      cx.beginPath();
      cx.arc(hx, H, 160 + (i%2)*60, Math.PI, 0);
      cx.fill();
    }
  }
}

function drawTile(ch, sx, sy, tx, ty){
  if (ch === "G"){
    cx.fillStyle = "#8a5a2b"; cx.fillRect(sx, sy, TILE, TILE);
    cx.fillStyle = "#6e4520";
    cx.fillRect(sx+2, sy+10, 14, 8); cx.fillRect(sx+20, sy+22, 12, 8);
    const above = course && tileAt(course.grid, tx, ty-1);
    if (!isSolid(above)){ cx.fillStyle = "#4fbc3c"; cx.fillRect(sx, sy, TILE, 8); cx.fillStyle="#7ade5c"; cx.fillRect(sx, sy, TILE, 3); }
  } else if (ch === "B"){
    cx.fillStyle = "#b8484a"; cx.fillRect(sx, sy, TILE, TILE);
    cx.fillStyle = "#8f3436";
    cx.fillRect(sx, sy+16, TILE, 3);
    cx.fillRect(sx+16, sy, 3, 16); cx.fillRect(sx+8, sy+19, 3, 17);
    cx.strokeStyle = "#6e2628"; cx.lineWidth = 2; cx.strokeRect(sx+1, sy+1, TILE-2, TILE-2);
  } else if (ch === "C"){
    const bob = Math.sin(time/12 + tx) * 3;
    cx.fillStyle = "#f7c800";
    cx.beginPath(); cx.ellipse(sx+TILE/2, sy+TILE/2+bob, 10, 13, 0, 0, Math.PI*2); cx.fill();
    cx.fillStyle = "#ffe670";
    cx.beginPath(); cx.ellipse(sx+TILE/2-3, sy+TILE/2+bob, 3, 9, 0, 0, Math.PI*2); cx.fill();
  } else if (ch === "S"){
    cx.fillStyle = "#c8ccd8";
    for (let i = 0; i < 3; i++){
      cx.beginPath();
      cx.moveTo(sx + i*12, sy + TILE);
      cx.lineTo(sx + i*12 + 6, sy + TILE*0.35);
      cx.lineTo(sx + i*12 + 12, sy + TILE);
      cx.fill();
    }
  } else if (ch === "L"){
    cx.drawImage(SPR_TURRET, sx, sy, TILE, TILE);
  } else if (ch === "A"){
    cx.fillStyle = "#8a6d2e"; cx.fillRect(sx+4, sy+8, TILE-8, TILE-12);
    cx.strokeStyle = "#5e4a1e"; cx.lineWidth = 2; cx.strokeRect(sx+5, sy+9, TILE-10, TILE-14);
    cx.fillStyle = "#e0b45c"; cx.fillRect(sx+4, sy+18, TILE-8, 5);
    cx.fillStyle = "#fff";
    cx.fillRect(sx+14, sy+12, 3, 5); cx.fillRect(sx+19, sy+12, 3, 5);
    cx.fillRect(sx+14, sy+25, 3, 5); cx.fillRect(sx+19, sy+25, 3, 5);
  } else if (ch === "K"){
    const active = checkpoint && checkpoint.tx === tx && checkpoint.ty === ty;
    cx.fillStyle = "#b8bcc8"; cx.fillRect(sx + 15, sy + 8, 4, TILE - 8);
    cx.fillStyle = active ? "#ffd428" : "#4fbc3c";
    cx.beginPath(); cx.arc(sx + 17, sy + 8, 7, 0, Math.PI*2); cx.fill();
    if (active){
      cx.fillStyle = "rgba(255,212,40,0.35)";
      cx.beginPath(); cx.arc(sx + 17, sy + 8, 12 + Math.sin(time/6)*2, 0, Math.PI*2); cx.fill();
    }
  } else if (ch === "F"){
    cx.fillStyle = "#d8d8e0"; cx.fillRect(sx + 6, sy - TILE*2, 4, TILE*3);
    cx.fillStyle = "#e33";
    cx.beginPath();
    cx.moveTo(sx + 10, sy - TILE*2);
    cx.lineTo(sx + 10 + 26, sy - TILE*2 + 10);
    cx.lineTo(sx + 10, sy - TILE*2 + 20);
    cx.fill();
    cx.fillStyle = "#f7c800"; cx.beginPath(); cx.arc(sx+8, sy-TILE*2, 5, 0, Math.PI*2); cx.fill();
  }
}

function drawLevel(g, camX, inEditor, viewW){
  const x0 = Math.max(0, Math.floor(camX / TILE) - 1);
  const x1 = Math.min(g[0].length - 1, Math.ceil((camX + (viewW || W)) / TILE) + 1);
  for (let ty = 0; ty < ROWS; ty++){
    for (let tx = x0; tx <= x1; tx++){
      const ch = g[ty][tx];
      if (ch === ".") continue;
      if (!inEditor && ch === "C" && collected && collected.has(tx+","+ty)) continue;
      if (!inEditor && (ch === "E" || ch === "D")) continue;   // drawn as entities
      const sx = Math.round(tx*TILE - camX), sy = ty*TILE;
      drawTile(ch, sx, sy, tx, ty);
      if (inEditor && ch === "E"){ cx.drawImage(SPR_CHASER, sx+4, sy+6, 28, 24); }
      if (inEditor && ch === "D"){ cx.drawImage(SPR_BOUNCER, sx+6, sy+6, 24, 24); }
    }
  }
}

function drawPlayer(){
  const spr = CHARACTERS[selChar].spr;
  const sx = Math.round(P.x - cam) - 5, sy = Math.round(P.y) - 8;
  if (P.dying > 0){
    cx.save();
    cx.translate(sx + 18, sy + 21);
    cx.rotate((80 - P.dying) * 0.15);
    cx.globalAlpha = Math.min(1, P.dying / 30);
    cx.drawImage(spr, -18, -21, 36, 42);
    cx.restore();
    return;
  }
  if (P.inv > 0 && Math.floor(P.inv / 5) % 2 === 0) return; // blink
  const bob = P.grounded ? Math.abs(Math.sin(P.anim/4)) * 2 : 0;
  cx.drawImage(spr, sx, sy - bob, 36, 42);
}
function drawBubble(x, y, r){
  cx.strokeStyle = "rgba(140,220,255,0.9)"; cx.lineWidth = 2.5;
  cx.beginPath(); cx.arc(x, y, r, 0, Math.PI*2); cx.stroke();
  cx.fillStyle = "rgba(140,220,255,0.18)";
  cx.beginPath(); cx.arc(x, y, r, 0, Math.PI*2); cx.fill();
  cx.fillStyle = "rgba(255,255,255,0.8)";
  cx.beginPath(); cx.arc(x - r*0.35, y - r*0.4, r*0.18, 0, Math.PI*2); cx.fill();
}
function drawShield(){
  if (P.shieldT <= 0) return;
  const sx = P.x + P.w + 6 - cam, sy = P.y + P.h/2;
  const a = P.shieldT < 25 ? (P.shieldT % 6 < 3 ? 0.3 : 0.9) : 0.9;   // blink when expiring
  cx.strokeStyle = "rgba(140,220,255," + a + ")"; cx.lineWidth = 5;
  cx.beginPath(); cx.arc(sx - 8, sy, 30, -Math.PI/2.4, Math.PI/2.4); cx.stroke();
  cx.strokeStyle = "rgba(255,255,255," + a * 0.7 + ")"; cx.lineWidth = 2;
  cx.beginPath(); cx.arc(sx - 8, sy, 34, -Math.PI/2.6, Math.PI/2.6); cx.stroke();
}
function drawShots(){
  for (const s of shots){
    const x = s.x - cam, y = s.y;
    if (s.t === "cart"){
      cx.save(); cx.translate(x, y); cx.rotate(time / 4);
      cx.fillStyle = "#4a4a58"; cx.fillRect(-8, -6, 16, 12);
      cx.fillStyle = "#e07b28"; cx.fillRect(-5, -3, 10, 6);
      cx.restore();
    } else if (s.t === "fire"){
      cx.fillStyle = "#ff8a3c";
      cx.beginPath(); cx.arc(x, y, 8 + Math.sin(time/2)*1.5, 0, Math.PI*2); cx.fill();
      cx.fillStyle = "#ffd428";
      cx.beginPath(); cx.arc(x, y, 4.5, 0, Math.PI*2); cx.fill();
    } else if (s.t === "star"){
      cx.save(); cx.translate(x, y); cx.rotate(time / 3);
      drawStar(0, 0, 13, true);
      cx.restore();
    } else if (s.t === "bub"){
      drawBubble(x, y, 10);
    } else if (s.t === "heart"){
      cx.fillStyle = "#ff5c9e";
      cx.beginPath();
      cx.arc(x - 4, y - 3, 5, 0, Math.PI*2); cx.arc(x + 4, y - 3, 5, 0, Math.PI*2);
      cx.moveTo(x - 9, y - 1); cx.lineTo(x, y + 10); cx.lineTo(x + 9, y - 1);
      cx.fill();
    } else if (s.t === "wave"){
      cx.strokeStyle = "rgba(255,255,255,0.95)"; cx.lineWidth = 5;
      cx.beginPath(); cx.arc(x - 10, y, 18, -Math.PI/2.6, Math.PI/2.6); cx.stroke();
      cx.strokeStyle = "rgba(140,220,255,0.8)"; cx.lineWidth = 3;
      cx.beginPath(); cx.arc(x - 18, y, 15, -Math.PI/2.8, Math.PI/2.8); cx.stroke();
    } else if (s.t === "sword"){
      // swinging blade: sweeps from up to forward over its life
      const prog = 1 - s.life / 14;
      const ang = -Math.PI/2 + prog * Math.PI * 0.85;
      cx.save(); cx.translate(x - 6, y);
      cx.rotate(ang);
      cx.fillStyle = "#d8dce8"; cx.fillRect(-3, -34, 6, 30);       // blade
      cx.fillStyle = "#fff"; cx.fillRect(-1, -34, 2, 30);          // shine
      cx.fillStyle = "#8a6d2e"; cx.fillRect(-6, -6, 12, 4);        // guard
      cx.fillStyle = "#5e4a1e"; cx.fillRect(-2, -2, 4, 8);         // grip
      cx.restore();
      cx.strokeStyle = "rgba(255,255,255,0.5)"; cx.lineWidth = 3;
      cx.beginPath(); cx.arc(x - 6, y, 36, -Math.PI/2, ang); cx.stroke();
    } else if (s.t === "trident"){
      const ang = Math.atan2(s.vy, s.vx);
      cx.save(); cx.translate(x, y); cx.rotate(ang);
      cx.fillStyle = "#e0c45c"; cx.fillRect(-16, -2, 28, 4);       // shaft
      cx.fillStyle = "#f7d878";
      cx.fillRect(12, -8, 4, 16);                                   // cross bar
      cx.fillRect(16, -8, 8, 3); cx.fillRect(16, -1.5, 10, 3); cx.fillRect(16, 5, 8, 3); // prongs
      cx.restore();
    } else if (s.t === "pellet"){
      cx.fillStyle = "rgba(255,212,40,0.4)"; cx.fillRect(x - 16, y - 3, 16, 6);
      cx.fillStyle = "#ffd428"; cx.fillRect(x - 6, y - 2.5, 10, 5);
      cx.fillStyle = "#fff"; cx.fillRect(x + 1, y - 1.5, 3, 3);
    }
  }
}
function drawWeaponIcon(id, x, y, sc){
  // small canvas icon for a weapon, centred at x,y
  cx.save(); cx.translate(x, y); cx.scale(sc || 1, sc || 1);
  if (id === "cart"){ cx.fillStyle = "#4a4a58"; cx.fillRect(-10, -8, 20, 16); cx.fillStyle = "#e07b28"; cx.fillRect(-6, -4, 12, 8); }
  else if (id === "star"){ drawStar(0, 0, 13, true); }
  else if (id === "fire"){ cx.fillStyle = "#ff8a3c"; cx.beginPath(); cx.arc(0, 0, 9, 0, Math.PI*2); cx.fill(); cx.fillStyle = "#ffd428"; cx.beginPath(); cx.arc(0, 0, 5, 0, Math.PI*2); cx.fill(); }
  else if (id === "shield"){ cx.strokeStyle = "#8ad4ff"; cx.lineWidth = 4; cx.beginPath(); cx.arc(-6, 0, 13, -Math.PI/2.4, Math.PI/2.4); cx.stroke(); }
  else if (id === "bub"){ drawBubble(0, 0, 10); }
  else if (id === "heart"){ cx.fillStyle = "#ff5c9e"; cx.beginPath(); cx.arc(-4, -3, 5, 0, Math.PI*2); cx.arc(4, -3, 5, 0, Math.PI*2); cx.moveTo(-9, -1); cx.lineTo(0, 10); cx.lineTo(9, -1); cx.fill(); }
  else if (id === "wave"){ cx.strokeStyle = "#fff"; cx.lineWidth = 4; cx.beginPath(); cx.arc(-6, 0, 12, -Math.PI/2.6, Math.PI/2.6); cx.stroke(); cx.strokeStyle = "#8ad4ff"; cx.lineWidth = 2; cx.beginPath(); cx.arc(-11, 0, 10, -Math.PI/2.8, Math.PI/2.8); cx.stroke(); }
  else if (id === "sword"){ cx.rotate(-Math.PI/4); cx.fillStyle = "#d8dce8"; cx.fillRect(-2.5, -16, 5, 22); cx.fillStyle = "#fff"; cx.fillRect(-0.5, -16, 1.5, 22); cx.fillStyle = "#8a6d2e"; cx.fillRect(-6, 6, 12, 3.5); cx.fillStyle = "#5e4a1e"; cx.fillRect(-1.5, 9, 3, 7); }
  else if (id === "trident"){ cx.rotate(-Math.PI/4); cx.fillStyle = "#e0c45c"; cx.fillRect(-1.5, -6, 3, 22); cx.fillStyle = "#f7d878"; cx.fillRect(-7, -8, 14, 3); cx.fillRect(-7, -15, 3, 8); cx.fillRect(-1.5, -17, 3, 10); cx.fillRect(4, -15, 3, 8); }
  else if (id === "gun"){ cx.fillStyle = "#4a4a58"; cx.fillRect(-11, -5, 20, 8); cx.fillStyle = "#6b6b80"; cx.fillRect(5, -3, 7, 4); cx.fillStyle = "#3a3a46"; cx.fillRect(-9, 3, 5, 8); cx.fillStyle = "#ffd428"; cx.fillRect(12, -2, 3, 2); }
  cx.restore();
}
function drawParts(){
  for (const p of parts){
    cx.globalAlpha = Math.min(1, p.life / 15);
    cx.fillStyle = p.col;
    cx.fillRect(p.x - cam - p.sz/2, p.y - p.sz/2, p.sz, p.sz);
  }
  cx.globalAlpha = 1;
}
function drawStar(x, y, r, filled){
  cx.beginPath();
  for (let i = 0; i < 10; i++){
    const ang = -Math.PI/2 + i * Math.PI/5;
    const rad = i % 2 === 0 ? r : r * 0.45;
    const px_ = x + Math.cos(ang) * rad, py_ = y + Math.sin(ang) * rad;
    if (i === 0) cx.moveTo(px_, py_); else cx.lineTo(px_, py_);
  }
  cx.closePath();
  if (filled){ cx.fillStyle = "#ffd428"; cx.fill(); cx.strokeStyle = "#b8860b"; }
  else { cx.fillStyle = "rgba(0,0,0,0.3)"; cx.fill(); cx.strokeStyle = "rgba(255,255,255,0.4)"; }
  cx.lineWidth = 2; cx.stroke();
}

function drawPlay(){
  drawSky(cam, course.theme);
  cx.save();
  if (shake > 0) cx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawLevel(playGrid || course.grid, cam, false);
  // beams
  for (const t of turrets){
    const sx = t.tx*TILE - cam, sy = t.ty*TILE;
    if (t.state === "warn" && Math.floor(time/5) % 2 === 0){
      const R = 8 * TILE;
      cx.fillStyle = "rgba(255,40,70,0.45)";
      cx.fillRect(sx + TILE/2 - 3, sy - R, 6, R * 2 + TILE);
      cx.fillRect(sx - R, sy + TILE/2 - 3, R * 2 + TILE, 6);
    }
  }
  if (state === "PLAY" || state === "PAUSE"){
    const bs = computedBeams;
    cx.fillStyle = "#ff2244";
    for (const b of bs){
      cx.fillRect(b.x - cam, b.y, b.w, b.h);
      cx.fillStyle = "rgba(255,120,140,0.8)";
      cx.fillRect(b.x - cam, b.y + b.h/2 - 1.5, b.w, 3);
      cx.fillStyle = "#ff2244";
    }
  }
  // chasers
  for (const e of chasers){
    if (!e.alive) continue;
    const flap = Math.floor(time/6) % 2 === 0 ? 1 : 0;
    cx.drawImage(SPR_CHASER, Math.round(e.x - cam), Math.round(e.y) - flap*3, 28, 24);
    if (e.bubbled > 0) drawBubble(e.x + 14 - cam, e.y + 10, 22);
  }
  // diagonal bouncers (spin as they fly)
  for (const b of bouncers){
    if (!b.alive) continue;
    cx.save();
    cx.translate(Math.round(b.x - cam) + 12, Math.round(b.y) + 12);
    if (!b.bubbled) cx.rotate(time / 12);
    cx.drawImage(SPR_BOUNCER, -12, -12, 24, 24);
    cx.restore();
    if (b.bubbled > 0) drawBubble(b.x + 12 - cam, b.y + 12, 22);
  }
  drawShots();
  drawPlayer();
  drawShield();
  drawParts();
  cx.restore();
  drawHUD();
  if (time < 200 && course === courses[0]){
    cx.fillStyle = "rgba(0,0,0,0.5)";
    roundRect(W/2-250, H-108, 500, 68, 12); cx.fill();
    text("TAP RIGHT SIDE = JUMP (hold = higher, tap again = double)", W/2, H-88, 14, "#fff");
    text("TAP LEFT SIDE = FIRE YOUR WEAPON! (grab ammo crates)", W/2, H-62, 14, "#ffd428");
  }
}

   EDITOR
   ============================================================ */
let ed = null;
const PALETTE = [
  { ch:"G", name:"GROUND" },
  { ch:"B", name:"BRICK" },
  { ch:"C", name:"COIN" },
  { ch:"S", name:"SPIKE" },
  { ch:"E", name:"CHASER" },
  { ch:"D", name:"BOUNCER" },
  { ch:"L", name:"LASER" },
  { ch:"A", name:"AMMO" },
  { ch:"K", name:"CHECK" },
  { ch:"F", name:"GOAL" },
  { ch:".", name:"ERASE" },
];
function openEditor(c){
  ed = { course:c, cam:0, tool:0, painting:false };
  state = "EDIT";
}
function editorPlace(gx, gy){
  const g = ed.course.grid;
  if (gx < 0 || gx >= g[0].length || gy < 0 || gy >= ROWS) return;
  if (gx <= 2 && PALETTE[ed.tool].ch !== ".") {
    // keep spawn area clear-ish above ground
    if (gy < 13 && isSolid(PALETTE[ed.tool].ch)) return;
  }
  const ch = PALETTE[ed.tool].ch;
  if (ch === "F"){
    // only one goal
    for (let r = 0; r < ROWS; r++)
      for (let x = 0; x < g[0].length; x++)
        if (g[r][x] === "F") g[r][x] = ".";
  }
  g[gy][gx] = ch;
}
const EDBAR = 96;
const EDS = (H - EDBAR) / H;   // editor zoom-out so ALL 15 rows fit above the toolbar
function drawEditor(){
  const g = ed.course.grid;
  drawSky(ed.cam, ed.course.theme);
  time++;
  cx.save();
  cx.scale(EDS, EDS);
  // grid tiles (use editor draw so enemies show)
  const saveCourse = course; course = ed.course;
  drawLevel(g, ed.cam, true, W / EDS);
  course = saveCourse;
  // start marker
  const stx = Math.round(TILE*1.2 - ed.cam);
  cx.globalAlpha = 0.6;
  cx.drawImage(CHARACTERS[selChar].spr, stx - 5, 12*TILE - 40, 36, 42);
  cx.globalAlpha = 1;
  text("START", stx + 13, 12*TILE - 50, 12, "#fff");
  // grid lines
  cx.strokeStyle = "rgba(255,255,255,0.13)"; cx.lineWidth = 1;
  const x0 = Math.floor(ed.cam/TILE), x1 = Math.ceil((ed.cam + W/EDS)/TILE);
  for (let tx = x0; tx <= x1; tx++){
    cx.beginPath(); cx.moveTo(tx*TILE - ed.cam, 0); cx.lineTo(tx*TILE - ed.cam, ROWS*TILE); cx.stroke();
  }
  for (let ty = 0; ty <= ROWS; ty++){
    cx.beginPath(); cx.moveTo(0, ty*TILE); cx.lineTo(W/EDS, ty*TILE); cx.stroke();
  }
  cx.restore();
  // bottom bar
  cx.fillStyle = "#181828"; cx.fillRect(0, H - EDBAR, W, EDBAR);
  cx.strokeStyle = "#565688"; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(0, H - EDBAR); cx.lineTo(W, H - EDBAR); cx.stroke();
  // palette
  for (let i = 0; i < PALETTE.length; i++){
    const x = 6 + i * 55, y = H - EDBAR + 10;
    const sel = ed.tool === i;
    addBtn("tool"+i, x, y, 51, 56, "", { bg: sel ? "#3d5e2e" : "#22223a", border: sel ? "#8aff5c" : "#444466" });
    const ch = PALETTE[i].ch;
    const tsx = x + 9, tsy = y + 6;
    if (ch === "."){ text("✖", x+25, y+24, 26, "#ff7788"); }
    else if (ch === "F"){
      // mini flag icon that fits the cell
      cx.fillStyle = "#d8d8e0"; cx.fillRect(x+20, y+8, 3, 36);
      cx.fillStyle = "#e33";
      cx.beginPath(); cx.moveTo(x+23, y+9); cx.lineTo(x+39, y+16); cx.lineTo(x+23, y+23); cx.fill();
    }
    else {
      cx.save(); cx.translate(tsx, tsy); cx.scale(0.75, 0.75);
      const sc = course; course = ed.course;
      if (ch === "E") cx.drawImage(SPR_CHASER, 0, 4, 36, 30);
      else if (ch === "D") cx.drawImage(SPR_BOUNCER, 2, 6, 32, 32);
      else drawTile(ch, 0, 0, 999, 0);
      course = sc; cx.restore();
    }
    text(PALETTE[i].name, x + 25, y + 50 + 12, 9, sel ? "#8aff5c" : "#aaa");
  }
  // right controls
  addBtn("edLeft",  626, H - EDBAR + 10, 52, 56, "◀");
  addBtn("edRight", 684, H - EDBAR + 10, 52, 56, "▶");
  addBtn("edTest",  744, H - EDBAR + 10, 100, 56, "TEST ▶", { bg:"#2e8b2e", border:"#7ade5c", font:"bold 17px" });
  addBtn("edDone",  850, H - EDBAR + 10, 98, 56, "DONE ✓", { bg:"#8a6d2e", border:"#e0b45c", font:"bold 17px" });
  // background mode switcher + course name (tap to rename!)
  addBtn("edBg", W - 170, 10, 158, 42, "BG: " + (ed.course.theme || "day").toUpperCase(), { font:"bold 16px" });
  addBtn("edName", 12, 10, 300, 42, "", { bg:"rgba(20,20,50,0.75)" });
  text("✎ " + ed.course.name, 162, 26, 14, "#ffd428");
  text("tap to rename", 162, 42, 9, "#8ad4ff");
}

/* ============================================================
   INPUT
   ============================================================ */
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
function hitButton(p){
  for (const b of uiButtons){
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b.id;
  }
  return null;
}
let selReturn = "TITLE";
function newCourse(){
  customCount++;
  const g = emptyGrid(100);
  stamp(g, 95, 12, "F");
  const c = { name:"MY COURSE " + customCount, grid:g, custom:true, theme:"day" };
  courses.push(c);
  return c;
}
function handleButton(id){
  S.click();
  if (id === "music"){ musicOn = !musicOn; saveData(); return; }
  if (state === "TITLE"){
    if (id === "play") state = "COURSES";
    if (id === "chars"){ selReturn = "TITLE"; state = "SELECT"; }
    if (id === "weap"){ selReturn = "TITLE"; state = "WEAPONS"; }
  } else if (state === "WEAPONS"){
    if (id.startsWith("wpn")){ selWeapon = parseInt(id.slice(3)); saveData(); }
    if (id === "back") state = selReturn;
  } else if (state === "SELECT"){
    if (id.startsWith("char")){ selChar = parseInt(id.slice(4)); saveData(); }
    if (id === "back") state = selReturn;
  } else if (state === "COURSES"){
    if (id === "back") state = "TITLE";
    if (id === "chars"){ selReturn = "COURSES"; state = "SELECT"; }
    if (id === "weap"){ selReturn = "COURSES"; state = "WEAPONS"; }
    if (id === "code") showImport();
    if (id === "crsUp") crsScroll--;
    if (id === "crsDown") crsScroll++;
    if (id === "create"){ openEditor(newCourse()); saveData(); }
    if (id.startsWith("share")){
      const c = courses[parseInt(id.slice(5))];
      if (c) showShare(c);
    } else if (id.startsWith("del")){
      const i = parseInt(id.slice(3));
      if (pendingDelete === i){
        courses.splice(i, 1); pendingDelete = null; saveData();
        toast = "COURSE DELETED"; toastT = 120;
      } else {
        pendingDelete = i; toast = "TAP ? AGAIN TO DELETE"; toastT = 150;
      }
    } else if (id.startsWith("play")){
      checkpoint = null;   // fresh run from the menu
      startCourse(courses[parseInt(id.slice(4))], false);
    } else if (id.startsWith("edit")){
      const i = parseInt(id.slice(4));
      const c = courses[i];
      if (c.custom) openEditor(c);
      else {
        customCount++;
        const copy = { name: c.name + " REMIX", grid: cloneGrid(c.grid), custom:true, theme: c.theme };
        courses.push(copy);
        openEditor(copy);
        saveData();
      }
    }
    if (!id.startsWith("del")) pendingDelete = null;
  } else if (state === "PLAY"){
    if (id === "pause") state = "PAUSE";
  } else if (state === "PAUSE"){
    if (id === "resume") state = "PLAY";
    if (id === "quit"){ state = editorReturn ? "EDIT" : "COURSES"; }
  } else if (state === "WIN" || state === "GAMEOVER"){
    if (id === "replay" || id === "retry") startCourse(course, editorReturn);
    if (id === "courses") state = "COURSES";
    if (id === "backEdit") state = "EDIT";
  } else if (state === "EDIT"){
    if (id.startsWith("tool")) ed.tool = parseInt(id.slice(4));
    if (id === "edBg"){
      const cur = THEMES.indexOf(ed.course.theme || "day");
      ed.course.theme = THEMES[(cur + 1) % THEMES.length];
      saveData();
    }
    if (id === "edName") showRename(ed.course);
    if (id === "edLeft")  ed.cam = Math.max(0, ed.cam - TILE*5);
    if (id === "edRight") ed.cam = Math.max(0, Math.min(ed.course.grid[0].length*TILE - W/EDS, ed.cam + TILE*5));
    if (id === "edTest"){ saveData(); startCourse(ed.course, true); }
    if (id === "edDone"){ saveData(); state = "COURSES"; toast = "COURSE SAVED!"; toastT = 120; }
  }
}

let pointerDown = false, jumpPtr = null;
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  ensureAudio(); startMusic();
  pointerDown = true;
  const p = canvasPos(e);
  const id = hitButton(p);
  if (id){ handleButton(id); return; }
  if (state === "PLAY"){
    if (p.x < W * 0.5){ shoot(); }            // left half = FIRE
    else { jump(); jumpPtr = e.pointerId; }   // right half = JUMP (hold for higher)
  }
  else if (state === "EDIT" && p.y < H - EDBAR){
    ed.painting = true;
    editorPlace(Math.floor((p.x/EDS + ed.cam)/TILE), Math.floor(p.y/EDS/TILE));
  }
});
cv.addEventListener("pointermove", (e) => {
  if (!pointerDown) return;
  const p = canvasPos(e);
  if (state === "EDIT" && ed && ed.painting && p.y < H - EDBAR){
    editorPlace(Math.floor((p.x/EDS + ed.cam)/TILE), Math.floor(p.y/EDS/TILE));
  }
});
window.addEventListener("pointerup", (e) => {
  pointerDown = false;
  if (jumpPtr === null || e.pointerId === jumpPtr){ jumpCut(); jumpPtr = null; }
  if (ed && ed.painting){ ed.painting = false; if (state === "EDIT") saveData(); }
});
window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  ensureAudio(); startMusic();
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW"){
    if (state === "PLAY") jump();
    e.preventDefault();
  }
  if (e.code === "KeyX" || e.code === "KeyZ"){
    if (state === "PLAY") shoot();
  }
  if (e.code === "Escape"){
    if (state === "PLAY") state = "PAUSE";
    else if (state === "PAUSE") state = "PLAY";
  }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") jumpCut();
});

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = 0, acc = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min(50, ts - last); last = ts;
  acc += dt;
  while (acc >= 1000/60){
    acc -= 1000/60;
    if (state === "PLAY"){ updatePlay(); computedBeams = laserBeams(); }
  }
  uiButtons = [];
  if (state === "TITLE") drawTitle();
  else if (state === "WEAPONS") drawWeaponsScreen();
  else if (state === "SELECT") drawSelect();
  else if (state === "COURSES") drawCourses();
  else if (state === "PLAY") drawPlay();
  else if (state === "PAUSE") drawPause();
  else if (state === "WIN") drawWin();
  else if (state === "GAMEOVER") drawGameOver();
  else if (state === "EDIT") drawEditor();
  if (toastT > 0){
    toastT--;
    cx.fillStyle = "rgba(10,10,30,0.85)";
    roundRect(W/2 - 190, H - 120, 380, 46, 12); cx.fill();
    cx.strokeStyle = "#8ad4ff"; cx.lineWidth = 2;
    roundRect(W/2 - 190, H - 120, 380, 46, 12); cx.stroke();
    text(toast, W/2, H - 97, 17, "#8ad4ff");
  }
}
loadData();

/* ---------- QR / link course import (#c=CODE in the URL) ---------- */
(function(){
  const mh = location.hash.match(/^#c=(.+)$/);
  if (!mh) return;
  let code = "";
  try{ code = decodeURIComponent(mh[1]); }catch(e){ code = mh[1]; }
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  const dup = courses.find(c => c.custom && courseCode(c) === code.trim());
  if (dup){ toast = "COURSE FROM A FRIEND: " + dup.name; toastT = 200; state = "COURSES"; return; }
  const c = importCode(code);
  if (c){ toast = "A FRIEND SENT YOU: " + c.name + "!"; toastT = 220; state = "COURSES"; }
})();



/* ---------- made-with badge (hidden during play/edit + previews) ---------- */
(function(){
  if (window.__previewMode) return;
  const saga = document.createElement("a");
  saga.href = "https://milan470.github.io/sketchagame/";
  saga.target = "_blank"; saga.rel = "noopener";
  saga.textContent = "MADE WITH SKETCH\u00b7A\u00b7GAME \u2014 make your own \u2192";
  saga.style.cssText = "position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:40;" +
    "font-family:monospace;font-size:11px;font-weight:bold;letter-spacing:1px;text-decoration:none;" +
    "color:#ffd428;background:rgba(10,10,26,0.75);border:1.5px solid #565688;border-radius:99px;" +
    "padding:6px 14px;opacity:0.85;";
  document.body.appendChild(saga);
  setInterval(() => {
    saga.style.display = (state === "PLAY" || state === "EDIT") ? "none" : "block";
  }, 400);
})();

/* ---------- preview modes (used by the website for live embeds) ---------- */
const PREVIEW = new URLSearchParams(location.search).get("preview");
if (PREVIEW){
  window.__previewMode = true;
  musicOn = false;
  cv.style.pointerEvents = "none";
  if (PREVIEW === "editor"){
    openEditor(courses[0]);
  } else if (PREVIEW === "play"){
    startCourse(courses[1], false);   // Laser Castle at night
    // simple autopilot so the preview plays itself
    setInterval(() => {
      if (state === "GAMEOVER" || state === "WIN"){ startCourse(courses[1], false); return; }
      if (state !== "PLAY" || !P.alive) return;
      const g = playGrid;
      const tx = Math.floor((P.x + P.w + 30) / TILE);
      let gapAhead = true;
      for (let r = Math.floor((P.y + P.h) / TILE); r < ROWS; r++){
        if (isSolid(tileAt(g, tx, r))){ gapAhead = false; break; }
      }
      let danger = false;
      for (const e of chasers) if (e.alive && Math.abs(e.x - P.x) < 90 && e.x > P.x - 20) danger = true;
      for (const b of bouncers) if (b.alive && Math.abs(b.x - P.x) < 90) danger = true;
      const wallAhead = isSolid(tileAt(g, tx, Math.floor((P.y + P.h - 10) / TILE)));
      const spikeAhead = tileAt(g, Math.floor((P.x + P.w + 40) / TILE), Math.floor((P.y + P.h + 4) / TILE)) === "S";
      if (gapAhead || danger || wallAhead || spikeAhead) jump();
      if (P.ammo > 0 && danger) shoot();
    }, 120);
  }
}

requestAnimationFrame(loop);

/* debug hooks (harmless in normal play) */
window.__dbg = {
  get state(){ return state; }, set state(s){ state = s; },
  get P(){ return P; }, get course(){ return course; },
  courses, startCourse, jump, openEditor,
  get ed(){ return ed; }, get bouncers(){ return bouncers; },
  get chasers(){ return chasers; },
  courseCode, importCode, saveData, newCourse,
  checkpointInfo: () => checkpoint ? checkpoint.tx + "," + checkpoint.ty : "none",
  setChar: (i) => { selChar = i; },
  setWeapon: (i) => { selWeapon = i; }, WEAPONS,
  damage: () => damagePlayer(),
  starProbe: () => ({ totalCoins, got: collected ? collected.size : -1, damaged }),
  CHARACTERS, CHAR_ABIL,
  shoot, get shots(){ return shots; }, get turrets(){ return turrets; },
  get playGrid(){ return playGrid; }, giveAmmo: (n) => { P.ammo = n; }
};
